<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role-Based RAG System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 90%;
            max-width: 800px;
            min-height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .role-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
            font-size: 14px;
        }

        .login-section, .chat-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        .user-message {
            background: #dbeafe;
            margin-left: 20px;
        }

        .assistant-message {
            background: #f3f4f6;
            margin-right: 20px;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .user-info {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0ea5e9;
        }

        .hidden {
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .demo-accounts {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .demo-accounts h4 {
            color: #92400e;
            margin-bottom: 10px;
        }

        .demo-accounts ul {
            list-style: none;
            font-size: 14px;
        }

        .demo-accounts li {
            margin: 5px 0;
            color: #78350f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Role-Based RAG System</h1>
            <p>Secure AI Assistant with Role-Based Access Control</p>
            <div id="roleDisplay" class="role-badge hidden"></div>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2>Login</h2>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button onclick="login()" id="loginBtn">Login</button>
            
            <!-- <div class="demo-accounts">
                <h4>Demo Accounts:</h4>
                <ul>
                    <li><strong>admin</strong> / admin123 - Full system access</li>
                    <li><strong>manager</strong> / manager123 - Management documents</li>
                    <li><strong>developer</strong> / dev123 - Technical documentation</li>
                </ul>
            </div> -->
        </div>

        <!-- Chat Section -->
        <div id="chatSection" class="chat-section hidden">
            <div id="userInfo" class="user-info"></div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="form-group">
                <label for="messageInput">Ask a question:</label>
                <textarea id="messageInput" rows="3" placeholder="Type your message here..."></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: space-between;">
                <button onclick="sendMessage()" id="sendBtn">Send Message</button>
                <button onclick="clearHistory()" style="background: #6b7280;">Clear History</button>
                <button onclick="logout()" style="background: #dc2626;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        let currentUser = null;
        let currentRole = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showStatus('Please enter both username and password', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span> Logging in...';

            try {
                const response = await fetch('http://localhost:5000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    currentUser = username;
                    currentRole = data.role;
                    
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('chatSection').classList.remove('hidden');
                    document.getElementById('roleDisplay').classList.remove('hidden');
                    document.getElementById('roleDisplay').textContent = `${currentRole.toUpperCase()} - ${currentUser}`;
                    
                    updateUserInfo(data);
                    showStatus(`Welcome ${currentUser}! You are logged in as ${currentRole}`, 'success');
                } else {
                    showStatus(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showStatus('Connection error. Make sure the server is running.', 'error');
            }

            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            const sendBtn = document.getElementById('sendBtn');

            if (!message) return;

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span> Sending...';

            addMessage(message, 'user');
            messageInput.value = '';

            try {
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ prompt: message })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.blocked) {
                        addMessage(`⚠️ ${data.message}`, 'error');
                    } else {
                        addMessage(data.response, 'assistant');
                    }
                } else {
                    addMessage(`Error: ${data.error || data.message}`, 'error');
                }
            } catch (error) {
                addMessage('Connection error. Please try again.', 'error');
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send Message';
        }

        async function clearHistory() {
            try {
                const response = await fetch('http://localhost:5000/clear_history', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.ok) {
                    document.getElementById('chatMessages').innerHTML = '';
                    showStatus('Chat history cleared', 'success');
                }
            } catch (error) {
                showStatus('Failed to clear history', 'error');
            }
        }

        function logout() {
            authToken = null;
            currentUser = null;
            currentRole = null;
            
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('roleDisplay').classList.add('hidden');
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            showStatus('Logged out successfully', 'success');
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = text;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateUserInfo(data) {
            const userInfoDiv = document.getElementById('userInfo');
            userInfoDiv.innerHTML = `
                <strong>User:</strong> ${currentUser} | 
                <strong>Role:</strong> ${data.role} | 
                <strong>Permissions:</strong> ${data.permissions.join(', ')}
            `;
        }

        function showStatus(message, type) {
            // Remove existing status messages
            const existingStatus = document.querySelector('.status');
            if (existingStatus) {
                existingStatus.remove();
            }

            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            
            const container = document.querySelector('.login-section:not(.hidden), .chat-section:not(.hidden)');
            if (container) {
                container.insertBefore(statusDiv, container.firstChild);
                
                setTimeout(() => {
                    statusDiv.remove();
                }, 5000);
            }
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
